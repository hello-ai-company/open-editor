# Production-ready manual OIDC publish path for FUTURE versions only (0.1.1+).
#
# Owner-confirmed external state (not re-verified by this file alone):
# - GitHub Environment `public-npmjs` CONFIGURED + PROTECTED (main only; no NPM_TOKEN)
# - npm Trusted Publisher CONFIGURED → GitHub Actions /
#   hello-ai-company/open-editor / publish-public-core.yml / Environment public-npmjs
#
# HARD RULES:
# - workflow_dispatch ONLY (never push / pull_request / release / schedule)
# - Never republish 0.1.0 or 0.0.0-phase3.e17b4b5
# - Never use NPM_TOKEN / NODE_AUTH_TOKEN / long-lived npm credentials
# - Do not rename this workflow file (Trusted Publisher binds to filename)
# - Do not auto-cancel an in-progress release
#
# Architecture (R1):
#   prepare (contents:read; no Environment; no id-token)
#     → npm ci + verify + fail-closed versions-list guards
#     → npm pack once + SHA-256 digest → upload artifact
#   → human Environment approval (public-npmjs)
#   → publish (contents:read + id-token:write)
#     → download artifact + SHA-256 match
#     → identity/ref/input/registry TOCTOU recheck (NO npm ci / verify / build)
#     → npm publish <tarball.tgz> (tokenless OIDC; no -w rebuild)
#
# OWNER ACTION before first 0.1.1+ dispatch:
#   Confirm Trusted Publisher "Allowed actions" permits direct `npm publish`.

name: publish-public-core

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version to publish (must match packages/core/package.json)"
        required: true
        type: string
      confirmation:
        description: 'Type exactly: PUBLISH @hello-ai-company/editor-core@<version>'
        required: true
        type: string

concurrency:
  group: npm-public-core-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Guarantee Trusted Publishing–capable npm
        run: npm install -g npm@^11

      - name: Show toolchain
        run: |
          node -v
          npm -v
          node -e '
            const { execSync } = require("child_process");
            const v = execSync("npm -v", { encoding: "utf8" }).trim();
            const [maj, min, patch] = v.split(".").map(Number);
            const ok =
              maj > 11 ||
              (maj === 11 && min > 5) ||
              (maj === 11 && min === 5 && patch >= 1);
            if (!ok) {
              console.error("STOP — npm >= 11.5.1 required for Trusted Publishing; got", v);
              process.exit(1);
            }
            console.log("npm version OK for Trusted Publishing:", v);
          '

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Release guards + pack immutable artifact
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/release/validate-public-core-release.mjs pack

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: public-core-release-artifact
          path: |
            release-artifact/*.tgz
            release-artifact/digest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: public-npmjs
    permissions:
      contents: read
      id-token: write
    steps:
      # Checkout is for package.json + shared guard script only.
      # Do NOT npm ci / verify / build under id-token (P1-2).
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Guarantee Trusted Publishing–capable npm
        run: npm install -g npm@^11

      - name: Show toolchain
        run: |
          node -v
          npm -v
          node -e '
            const { execSync } = require("child_process");
            const v = execSync("npm -v", { encoding: "utf8" }).trim();
            const [maj, min, patch] = v.split(".").map(Number);
            const ok =
              maj > 11 ||
              (maj === 11 && min > 5) ||
              (maj === 11 && min === 5 && patch >= 1);
            if (!ok) {
              console.error("STOP — npm >= 11.5.1 required for Trusted Publishing; got", v);
              process.exit(1);
            }
            console.log("npm version OK for Trusted Publishing:", v);
          '

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: public-core-release-artifact
          path: release-artifact

      - name: TOCTOU recheck + artifact digest
        id: artifact
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/release/validate-public-core-release.mjs verify-artifact release-artifact | tee /tmp/artifact-verify.log
          TARBALL_PATH=$(grep '^TARBALL_PATH=' /tmp/artifact-verify.log | cut -d= -f2-)
          if [ -z "$TARBALL_PATH" ] || [ ! -f "$TARBALL_PATH" ]; then
            echo "STOP — tarball path missing after artifact verify"
            exit 1
          fi
          echo "tarball=$TARBALL_PATH" >> "$GITHUB_OUTPUT"

      # Tokenless Trusted Publishing (OIDC). Publish the immutable prepared
      # tarball only — no workspace rebuild (-w), no lifecycle scripts.
      # Provenance is automatic for public repo + public package under TP.
      # OWNER must confirm Trusted Publisher "Allowed actions" includes
      # direct `npm publish` before the first real dispatch.
      - name: Publish tarball to npmjs (OIDC / Trusted Publishing)
        run: >
          npm publish "${{ steps.artifact.outputs.tarball }}"
          --access public
          --registry=https://registry.npmjs.org
          --ignore-scripts
