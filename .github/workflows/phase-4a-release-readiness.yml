name: phase-4a-release-readiness

on:
  push:
    branches:
      - grokbot/phase-4a-editor-core-release-readiness
  pull_request:
    branches:
      - main
      - grokbot/phase-4a-editor-core-release-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack -w @hello-ai-company/editor-core

      - name: Inspect tarball
        run: node scripts/inspect-tarball.mjs

      - name: Isolated consumer
        run: node scripts/isolated-consumer.mjs

      - name: Security scan
        run: node scripts/security-scan.mjs

      - name: API contract
        run: node scripts/api-contract.mjs
