name: publish-private-core

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@hello-ai"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack -w @hello-ai/editor-core

      - name: Inspect tarball
        run: node scripts/inspect-tarball.mjs

      - name: Security scan
        run: node scripts/security-scan.mjs

      - name: Publish gate
        run: |
          node -e '
            const { readFileSync } = require("fs");
            const pkg = JSON.parse(readFileSync("packages/core/package.json", "utf8"));
            if (pkg.publishConfig?.registry !== "https://npm.pkg.github.com") {
              console.error("STOP — publishConfig.registry is not GitHub Packages");
              process.exit(1);
            }
            if (pkg.version !== "0.0.0-phase3.e17b4b5") {
              console.error("STOP — version is not the authorized prerelease");
              process.exit(1);
            }
            if (pkg.private === true) {
              console.error("STOP — packages/core must not set private:true");
              process.exit(1);
            }
          '

      - name: Refuse existing version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          if npm view "@hello-ai/editor-core@0.0.0-phase3.e17b4b5" version --registry=https://npm.pkg.github.com; then
            echo "STOP — PACKAGE VERSION ALREADY EXISTS"
            exit 1
          fi

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish -w @hello-ai/editor-core --access restricted --provenance=false
