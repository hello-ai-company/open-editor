# Production-safe manual OIDC publish path for @hello-ai-company/editor-blocknote@0.1.1
# (R3.1 hardening of the reviewed BlockNote candidate release).
#
# HARD RULES:
# - workflow_dispatch ONLY (never push / pull_request / release / schedule)
# - Never use NPM_TOKEN / NODE_AUTH_TOKEN / long-lived npm credentials
# - Do not rename this workflow file (Trusted Publisher binds to filename)
# - Do not auto-cancel an in-progress release
# - Publish only after exact editor-core@0.1.1 is already on npmjs
# - Do not claim npm Trusted Publisher is configured from this file alone
#
# Architecture:
#   prepare (contents:read; no Environment; no id-token)
#     → reviewed SHA + npm ci --ignore-scripts + verify + release guards + isolated-blocknote + pack once
#     → SHA-256 digest → upload artifact
#   → human Environment approval (public-npmjs)
#   → publish (contents:read + id-token:write)
#     → download artifact + exact-file/SHA-256 match
#     → identity/ref/input/registry TOCTOU recheck (NO npm ci / verify / build)
#     → npm publish <tarball.tgz> (tokenless OIDC; --ignore-scripts)
#     → bounded post-publish name/version/license/tarball/integrity proof
#
# OWNER ACTION before dispatch:
#   Configure npm Trusted Publisher for this package →
#     GitHub Actions / hello-ai-company/open-editor /
#     publish-public-blocknote.yml / Environment public-npmjs
#   Confirm Trusted Publisher "Allowed actions" permits direct `npm publish`.
#   TRUSTED PUBLISHER: OWNER CONFIGURATION REQUIRED (not asserted here).

name: publish-public-blocknote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact package version to publish (must match packages/blocknote/package.json)"
        required: true
        type: string
      reviewed_commit:
        description: "Exact reviewed main commit SHA (must equal the workflow dispatch SHA)"
        required: true
        type: string
      confirmation:
        description: 'Type exactly: PUBLISH @hello-ai-company/editor-blocknote@0.1.1'
        required: true
        type: string

concurrency:
  group: npm-public-blocknote-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    if: github.ref == 'refs/heads/main' && inputs.reviewed_commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      npm_config_ignore_scripts: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.reviewed_commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Guarantee Trusted Publishing–capable npm
        run: |
          curl --fail --silent --show-error --location https://registry.npmjs.org/npm/-/npm-11.20.0.tgz --output /tmp/npm-11.20.0.tgz
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const actual = createHash("sha512").update(readFileSync(process.argv[1])).digest("base64");
            if (actual !== "dF3EDFwbYN+N5RUip+ZYDe0NeURK5BgqKOcvT1iNtUYhTMTl0FwWhBuXrS7KtXyduqyTMS5aaQaregnHDAxNgw==") {
              console.error("STOP — npm tarball integrity mismatch");
              process.exit(1);
            }
          ' /tmp/npm-11.20.0.tgz
          npm install --global --ignore-scripts --no-audit --no-fund /tmp/npm-11.20.0.tgz

      - name: Show toolchain
        run: |
          node -v
          npm -v
          node -e '
            const { execSync } = require("child_process");
            const v = execSync("npm -v", { encoding: "utf8" }).trim();
            const [maj, min, patch] = v.split(".").map(Number);
            const ok =
              maj > 11 ||
              (maj === 11 && min > 5) ||
              (maj === 11 && min === 5 && patch >= 1);
            if (!ok) {
              console.error("STOP — npm >= 11.5.1 required for Trusted Publishing; got", v);
              process.exit(1);
            }
            console.log("npm version OK for Trusted Publishing:", v);
          '

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

      - name: Release guards (explicit)
        run: npm run test:release-guards

      - name: Isolated BlockNote consumer (explicit)
        run: npm run verify:isolated-blocknote

      - name: Release guards + pack immutable artifact
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          RELEASE_WORKFLOW_REF: ${{ github.ref }}
          RELEASE_WORKFLOW_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW_SHA: ${{ github.sha }}
        run: node scripts/release/validate-public-blocknote-release.mjs pack

      - name: Upload release artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: public-blocknote-release-artifact
          path: |
            release-artifact-blocknote/*.tgz
            release-artifact-blocknote/digest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: prepare
    if: github.ref == 'refs/heads/main' && inputs.reviewed_commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: public-npmjs
    permissions:
      contents: read
      id-token: write
    steps:
      # Checkout is for package.json + shared guard script only.
      # Do NOT npm ci / verify / build under id-token.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.reviewed_commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Guarantee Trusted Publishing–capable npm
        run: |
          curl --fail --silent --show-error --location https://registry.npmjs.org/npm/-/npm-11.20.0.tgz --output /tmp/npm-11.20.0.tgz
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            const actual = createHash("sha512").update(readFileSync(process.argv[1])).digest("base64");
            if (actual !== "dF3EDFwbYN+N5RUip+ZYDe0NeURK5BgqKOcvT1iNtUYhTMTl0FwWhBuXrS7KtXyduqyTMS5aaQaregnHDAxNgw==") {
              console.error("STOP — npm tarball integrity mismatch");
              process.exit(1);
            }
          ' /tmp/npm-11.20.0.tgz
          npm install --global --ignore-scripts --no-audit --no-fund /tmp/npm-11.20.0.tgz

      - name: Show toolchain
        run: |
          node -v
          npm -v
          node -e '
            const { execSync } = require("child_process");
            const v = execSync("npm -v", { encoding: "utf8" }).trim();
            const [maj, min, patch] = v.split(".").map(Number);
            const ok =
              maj > 11 ||
              (maj === 11 && min > 5) ||
              (maj === 11 && min === 5 && patch >= 1);
            if (!ok) {
              console.error("STOP — npm >= 11.5.1 required for Trusted Publishing; got", v);
              process.exit(1);
            }
            console.log("npm version OK for Trusted Publishing:", v);
          '

      - name: Download release artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: public-blocknote-release-artifact
          path: release-artifact-blocknote

      - name: TOCTOU recheck + artifact digest
        id: artifact
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          INPUT_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          RELEASE_WORKFLOW_REF: ${{ github.ref }}
          RELEASE_WORKFLOW_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          node scripts/release/validate-public-blocknote-release.mjs verify-artifact release-artifact-blocknote | tee /tmp/artifact-verify.log
          TARBALL_PATH=$(grep '^TARBALL_PATH=' /tmp/artifact-verify.log | cut -d= -f2-)
          if [ -z "$TARBALL_PATH" ] || [ ! -f "$TARBALL_PATH" ]; then
            echo "STOP — tarball path missing after artifact verify"
            exit 1
          fi
          echo "tarball=$TARBALL_PATH" >> "$GITHUB_OUTPUT"

      # Tokenless Trusted Publishing (OIDC). Publish the immutable prepared
      # tarball only — no workspace rebuild (-w), no lifecycle scripts.
      # Provenance is automatic for public repo + public package under TP.
      # OWNER must configure Trusted Publisher for this workflow filename
      # and confirm "Allowed actions" includes direct `npm publish`
      # before the first real dispatch.
      # TRUSTED PUBLISHER: OWNER CONFIGURATION REQUIRED
      - name: Publish tarball to npmjs (OIDC / Trusted Publishing)
        run: >
          npm publish "${{ steps.artifact.outputs.tarball }}"
          --access public
          --registry=https://registry.npmjs.org
          --ignore-scripts

      - name: Verify npm registry identity and tarball integrity
        run: node scripts/release/verify-public-package-published.mjs blocknote "${{ steps.artifact.outputs.tarball }}"
