# TEMPLATE ONLY — not an active GitHub Actions workflow.
# Do NOT copy this file into `.github/workflows/` until written D1-EXEC,
# the GitHub repository is PUBLIC, 0.1.0 has already been bootstrap-published
# exactly once, and npm Trusted Publisher is configured on that existing package.
# This template must not run in Phase 4E / R1.
#
# Purpose: ONGOING releases AFTER `@hello-ai-company/editor-core@0.1.0` exists
# on https://registry.npmjs.org. Trusted Publishing requires an already-existing
# npm package. The first 0.1.0 publish is a separate bootstrap (see
# docs/first-public-publish-bootstrap.md). Do not use this template for 0.1.0.
#
# Trusted Publishing (OIDC):
# - No NPM_TOKEN. Never NODE_AUTH_TOKEN / secrets.NPM_TOKEN.
# - Node 24 + npm ^11 (Trusted Publishing–capable). The `npm trust` CLI, if used
#   later to inspect/configure publishers, requires npm >= 11.15.0.
# - permissions.id-token: write is for OIDC to npmjs only after Trusted Publisher
#   is configured on the existing package.
#
# Optional future practice (not required in this template): publish from a
# staging dist / `npm publish --dry-run` then a separate human-gated publish
# step (stage-first). Keep auto-publish-on-push forbidden.
#
# Never:
# - env.NODE_AUTH_TOKEN / secrets.NPM_TOKEN
# - auto-publish on push
# - republish 0.0.0-phase3.e17b4b5
# - republish 0.1.0 (immutable once on npmjs)

name: publish-public-core

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: public-npmjs # create this GitHub Environment later; require reviewers
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Guarantee Trusted Publishing–capable npm
        run: npm install -g npm@^11

      - name: Show toolchain
        run: |
          node -v
          npm -v

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Identity lock
        run: |
          node -e '
            const { readFileSync } = require("fs");
            const pkg = JSON.parse(readFileSync("packages/core/package.json", "utf8"));
            if (pkg.name !== "@hello-ai-company/editor-core") process.exit(1);
            if (pkg.license !== "MIT") process.exit(1);
            if (pkg.publishConfig?.registry !== "https://registry.npmjs.org") process.exit(1);
            if (pkg.publishConfig?.access !== "public") process.exit(1);
            if (pkg.version === "0.1.0") {
              console.error("STOP — 0.1.0 is bootstrap-only; this OIDC template is for later versions");
              process.exit(1);
            }
            if (pkg.version === "0.0.0-phase3.e17b4b5") process.exit(1);
          '

      # PLACEHOLDER — do not uncomment in Phase 4E.
      # Only after: D1-EXEC, repo PUBLIC, PVR enabled, 0.1.0 already on npmjs,
      # Trusted Publisher configured on that existing package, this file copied
      # under .github/workflows/, GitHub Environment public-npmjs exists.
      # - name: Publish to npmjs (OIDC / Trusted Publishing)
      #   run: npm publish -w @hello-ai-company/editor-core --access public --registry=https://registry.npmjs.org --provenance
